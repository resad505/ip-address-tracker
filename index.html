<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="IP Address Tracker - Track any IP address or domain location on an interactive map.">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link href="./src/output.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <title>Frontend Mentor | IP Address Tracker</title>
</head>

<body class="font-rubik">
  <main class="flex flex-col relative min-h-screen min-h-dvh">
    <header
      class="min-h-[250px] p-6 text-center bg-[url('../images/pattern-bg-mobile.png')] bg-no-repeat bg-cover md:bg-[url('../images/pattern-bg-desktop.png')] md:bg-center ">
      <h1 class="text-white text-2xl md:text-3xl font-bold mb-6">IP Address Tracker</h1>
      <form action="" role="search" id="searchForm" class="flex flex-col justify-center items-center ">
        <div
          class="flex justify-center items-center flex-row rounded-md border w-11/12 max-w-lg mx-auto  overflow-hidden">
          <input id="formInput" aria-label="Search for any IP address or domain"
            class="px-5 py-3 md:text-base outline-none bg-white flex-1 text-lg focus:ring-2 focus:ring-gray-950"
            type="text" placeholder="Search for any IP address or domain">
          <button type="submit" id="submitBtn"
            class="bg-black  flex items-center justify-center cursor-pointer hover:bg-gray-800 transition-colors w-14 self-stretch focus-visible:ring-2 focus-visible:ring-gray-950 focus-visible:outline-none"
            aria-label="search">
            <img src="./images/icon-arrow.svg" alt="" aria-hidden="true">
          </button>
        </div>
        <p id="errorMsg" role="alert"
          class="mt-3 hidden rounded-md bg-white px-3 py-1 text-sm font-medium text-red-700"></p>
      </form>
    </header>
    <div id="map" aria-label="Location map" class="flex-1 min-h-0 md:min-h-[450px] w-full">
    </div>
    <section class="absolute w-full inset-x-0 z-[1000] top-52" aria-label="IP address details">
      <p id="statusMsg" role="status" class="sr-only"></p>
      <div
        class="flex flex-col items-center text-center gap-6 md:flex-row md:text-left md:justify-between md:items-start md:gap-0 justify-center rounded-2xl shadow-xl p-6 md:py-8 md:px-8 w-11/12 max-w-5xl mx-auto bg-white">
        <div class="md:flex-1">
          <h2 class="text-[10px] md:text-xs font-bold uppercase tracking-widest text-gray-400 mb-1 md:mb-2">IP Address
          </h2>
          <span id="ipAddress" class="text-xl md:text-2xl font-bold text-gray-950 break-words"></span>
        </div>
        <div class="md:border-l md:border-gray-200 md:pl-6 md:pr-4 md:flex-1">
          <h2 class="text-[10px] md:text-xs font-bold uppercase tracking-widest text-gray-400 mb-1 md:mb-2">Location
          </h2>
          <span id="location" class="text-xl md:text-2xl font-bold text-gray-950 break-words"></span>
        </div>
        <div class="md:border-l md:border-gray-200 md:pl-6 md:pr-4 md:flex-1">
          <h2 class="text-[10px] md:text-xs font-bold uppercase tracking-widest text-gray-400 mb-1 md:mb-2">Timezone
          </h2>
          <span id="timezone" class="text-xl md:text-2xl font-bold text-gray-950 break-words"></span>
        </div>
        <div class="md:border-l md:border-gray-200 md:pl-6 md:pr-4 md:flex-1">
          <h2 class="text-[10px] md:text-xs font-bold uppercase tracking-widest text-gray-400 mb-1 md:mb-2 ">ISP
          </h2>
          <span id="isp" class="text-xl md:text-2xl font-bold text-gray-950 break-words"></span>
        </div>
      </div>
    </section>

  </main>
  <footer
    class="fixed bottom-2 left-1/2 -translate-x-1/2 z-[1000] w-11/12 max-w-fit text-center text-[10px] md:text-xs text-gray-700 bg-white/80 backdrop-blur-sm px-4 py-1.5 rounded-full shadow-md">
    Challenge by <a
      href="https://www.frontendmentor.io/solutions/ip-address-tracker-vanilla-js-tailwind-css-and-leafletjs-Oar2AcqgwX"
      target="_blank" rel="noopener noreferrer" class="font-bold underline hover:text-black">Frontend Mentor</a>.
    Coded by <a href="https://www.linkedin.com/in/reshadmammedov" target="_blank" rel="noopener noreferrer"
      class="font-bold underline hover:text-black">Reshad
      Mammedov</a>.
  </footer>

  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="./src/map.js" defer></script>
  <script src="./src/index.js" defer></script>
  <script src="./src/api.js" defer></script>
</body>

</html>
